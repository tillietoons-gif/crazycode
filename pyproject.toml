[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycode"
version = "0.10.0"
description = "A Python-based AI coding agent (Claude Code alternative)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
pycode = "pycode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
